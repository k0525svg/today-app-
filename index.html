<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b1b">
<title>ASTRA — 오늘의 별자리</title>
<meta name="description" content="매일 새롭게 펼쳐지는 12개 별자리의 오늘의 운세">
<style>
:root{--bg:#f7f6f2;--paper:#fff;--ink:#202b39;--muted:#7c8490;--line:#e9e6df;--gold:#a88952;--navy:#182638;--soft:#f3eee4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;line-height:1.75}
.wrap{width:min(100% - 32px,920px);margin:auto}
header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.head{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:13px;font-weight:800;letter-spacing:.24em;color:var(--gold)}
.today{font-size:12px;color:var(--muted)}
.hero{text-align:center;padding:50px 0 34px}
.kicker{font-size:10px;letter-spacing:.24em;color:var(--gold);font-weight:800}
h1{font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(30px,5vw,44px);font-weight:500;letter-spacing:-.045em;margin:8px 0}
.sub{font-size:13px;color:var(--muted);margin:0}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.section-title strong{font-size:14px}.section-title span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.sign{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:12px 4px 10px;cursor:pointer;color:var(--ink);transition:.16s}
.sign:hover{border-color:#c8b58f;transform:translateY(-1px)}
.sign.active{background:var(--navy);border-color:var(--navy);color:white}
.symbol{display:block;font-family:Georgia,serif;font-size:25px;color:var(--gold);line-height:1.2}
.sign-name{display:block;font-size:11px;margin-top:5px;white-space:nowrap}
.result{display:none;margin:28px 0 42px}
.banner{background:var(--navy);color:white;border-radius:15px;padding:25px 27px}
.banner-label{font-size:10px;letter-spacing:.18em;color:#d8c39b}
.banner h2{font-family:Georgia,"Noto Serif KR",serif;font-weight:500;font-size:25px;line-height:1.4;margin:8px 0}
.banner p{color:#e1e5ea;font-size:13px;line-height:1.9;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:17px}
.tag{border:1px solid #ffffff3d;color:#f0e8da;border-radius:30px;padding:4px 9px;font-size:10px}
.cards{background:white;border:1px solid var(--line);border-radius:15px;margin-top:12px;overflow:hidden}
.fortune{display:grid;grid-template-columns:105px 1fr;gap:16px;padding:20px 23px;border-bottom:1px solid var(--line)}
.fortune:last-child{border-bottom:0}
.label-row{display:flex;flex-direction:column;gap:4px}.label{font-size:13px;font-weight:750;color:var(--gold);padding-top:2px}.mini-score{font-size:11px;letter-spacing:1px;color:var(--gold);white-space:nowrap}.mini-score .num{letter-spacing:0;color:var(--muted);font-size:10px;margin-left:4px}
.copy{font-size:13px;color:#505b68;line-height:2;margin:0;word-break:keep-all}
.tip{background:var(--soft);border-radius:12px;margin-top:12px;padding:17px 20px}
.tip b{font-size:12px;color:#8b7042}.tip p{font-size:13px;color:#505b68;margin:5px 0 0}
footer{text-align:center;color:#969ba2;font-size:10px;padding:4px 0 34px}
@media(max-width:600px){.wrap{width:calc(100% - 24px)}.hero{padding:38px 0 26px}.grid{grid-template-columns:repeat(4,1fr);gap:7px}.sign{padding:10px 2px}.symbol{font-size:23px}.banner{padding:21px 18px}.banner h2{font-size:22px}.fortune{grid-template-columns:1fr;gap:3px;padding:16px 17px}.copy{font-size:12px}.label{font-size:12px}}

/* ===== ASTRA: DARK CELESTIAL THEME OVERRIDE ===== */
:root{--bg:#080b1b;--paper:#11162d;--ink:#f2e9dc;--muted:#aaa5bc;--line:rgba(210,174,117,.25);--gold:#e3bd7b;--navy:#171b3a;--soft:#211d3b}
html,body{min-height:100%;background-color:#080b1b!important;color:#f2e9dc!important}

header{background:rgba(7,10,25,.82)!important;border-bottom:1px solid rgba(227,189,123,.3)!important;backdrop-filter:blur(12px)}
.brand,.kicker,.label,.mini-score{color:#e3bd7b!important}.today,.sub,.section-title span{color:#b5aec4!important}
h1{color:#f5e5cb!important;text-shadow:0 0 28px rgba(227,189,123,.18)}
.section-title strong{color:#f1e5d4!important}
.sign{background:linear-gradient(145deg,#1b2040,#11162e)!important;border:1px solid rgba(210,174,117,.32)!important;color:#f0e7dc!important;box-shadow:inset 0 1px rgba(255,255,255,.035),0 8px 22px rgba(0,0,0,.2)}
.sign:hover{border-color:#e3bd7b!important;box-shadow:0 0 20px rgba(227,189,123,.15)!important}
.sign.active{background:linear-gradient(145deg,#60456f,#252c50)!important;border-color:#e3bd7b!important;color:#fff8ed!important}
.symbol{color:#e8c384!important;text-shadow:0 0 14px rgba(227,189,123,.28)}
.banner{background:radial-gradient(ellipse at 85% 5%,rgba(117,76,145,.27),transparent 45%),linear-gradient(135deg,#20264b,#11162f)!important;border:1px solid rgba(227,189,123,.55)!important;color:#fff4e4!important;box-shadow:0 14px 42px rgba(0,0,0,.25)}
.banner-label{color:#e8c78f!important}.banner h2{color:#f6e3c5!important}.banner p{color:#e1d9e8!important}
.tag{border-color:rgba(227,189,123,.45)!important;background:rgba(7,10,27,.35)!important;color:#f2dcb7!important}
.cards{background:#11162d!important;border:1px solid rgba(210,174,117,.3)!important;box-shadow:0 14px 38px rgba(0,0,0,.22)}
.fortune{border-bottom-color:rgba(210,174,117,.2)!important}.copy{color:#e0d9e7!important}.mini-score .num{color:#bdb4ca!important}
.tip{background:linear-gradient(135deg,#302749,#1b2342)!important;border:1px solid rgba(210,174,117,.32)!important}.tip b{color:#edc681!important}.tip p{color:#e1d9e7!important}
footer{color:#928da5!important}
@media(max-width:600px){.sign{background:linear-gradient(145deg,#1b2040,#11162e)!important}}

</style>
</head>
<body>
<header><div class="wrap head"><div class="brand">ASTRA</div><div class="today" id="date"></div></div></header>
<main class="wrap">
<section class="hero"><div class="kicker">DAILY ASTROLOGY</div><h1>오늘의 별자리 운세</h1><p class="sub">하루의 흐름을 읽고, 나만의 방향을 발견하는 시간</p></section>
<section><div class="section-title"><strong>별자리 선택</strong><span>별자리를 누르면 오늘의 해석이 펼쳐집니다</span></div><div class="grid" id="grid"></div></section>
<section class="result" id="result">
<div class="banner"><div class="banner-label" id="bannerDate"></div><h2 id="headline"></h2><p id="summary"></p><div class="tags"><span class="tag" id="score"></span><span class="tag" id="color"></span><span class="tag" id="number"></span><span class="tag" id="time"></span></div></div>
<div class="cards">
<div class="fortune"><div class="label-row"><div class="label">종합운</div><div class="mini-score" id="overallScore"></div></div><p class="copy" id="overall"></p></div>
<div class="fortune"><div class="label-row"><div class="label">애정운</div><div class="mini-score" id="loveScore"></div></div><p class="copy" id="love"></p></div>
<div class="fortune"><div class="label-row"><div class="label">금전운</div><div class="mini-score" id="moneyScore"></div></div><p class="copy" id="money"></p></div>
<div class="fortune"><div class="label-row"><div class="label">직장운</div><div class="mini-score" id="workScore"></div></div><p class="copy" id="work"></p></div>
<div class="fortune"><div class="label-row"><div class="label">건강운</div><div class="mini-score" id="healthScore"></div></div><p class="copy" id="health"></p></div>
</div><div class="tip"><b>오늘의 별자리 조언</b><p id="advice"></p></div>
</section>
</main>
<footer class="wrap">ASTRA DAILY HOROSCOPE · 운세는 재미와 자기 성찰을 위한 콘텐츠이며 중요한 결정의 유일한 근거로 삼지 마세요.</footer>

"집중력이 필요한 업무를 먼저 처리하면 하루의 효율이 높아질 수 있습니다. 사소한 확인 절차를 생략하지 말고 기록을 남겨두면 실수를 예방하는 데 도움이 됩니다. 주변의 평가에 지나치게 흔들리기보다 자신이 맡은 역할을 꾸준히 수행하세요. 성실하게 쌓은 결과가 신뢰로 연결됩니다.",
"오늘은 새로운 아이디어를 현실적인 계획으로 바꾸기에 알맞습니다. 생각을 제안할 때는 기대 효과와 실행 순서를 함께 설명하면 설득력이 높아집니다. 예상보다 진행이 늦어져도 조급하게 방향을 바꾸지 말고 원인을 먼저 확인하세요. 유연함과 책임감을 함께 보여주는 것이 핵심입니다."
],
health:[
"몸의 리듬을 일정하게 유지하는 것이 중요합니다. 식사를 거르거나 휴식 시간을 뒤로 미루지 말고 기본적인 생활 패턴을 챙겨보세요. 오래 앉아 있었다면 잠시 일어나 가볍게 움직이는 것만으로도 기분 전환에 도움이 됩니다. 피로가 쌓였다면 무리한 일정보다 충분한 휴식을 우선하세요.",
"생각이 많아지면 몸의 긴장도 함께 높아질 수 있습니다. 짧게라도 화면에서 눈을 떼고 호흡을 고르며 어깨와 목을 풀어주세요. 카페인이나 늦은 시간의 과식은 수면 리듬에 영향을 줄 수 있으니 섭취 시간을 살펴보는 편이 좋습니다. 오늘은 회복을 위한 작은 습관을 만드는 데 집중하세요.",
"활동량과 휴식의 균형을 맞추면 컨디션을 안정적으로 유지할 수 있습니다. 바쁜 일정 중에도 물을 마시고 가벼운 식사를 챙기는 일을 잊지 마세요. 운동을 한다면 무리하게 강도를 높이기보다 몸 상태에 맞춰 조절하는 것이 좋습니다. 몸이 보내는 불편한 신호가 지속되면 전문가의 도움을 받으세요.",
"하루의 끝을 차분하게 정리하면 다음 날의 컨디션에도 도움이 됩니다. 잠들기 전 자극적인 콘텐츠를 줄이고 일정한 시간에 쉬는 습관을 만들어 보세요. 긴장을 풀 수 있는 산책이나 스트레칭도 좋은 선택입니다. 오늘은 더 많이 해내는 것보다 잘 회복하는 것을 목표로 삼아도 좋겠습니다."
]
};
const advice=[
"오늘의 핵심은 서두르지 않고 자신의 속도를 지키는 것입니다.",
"작은 약속을 지키는 일이 생각보다 큰 신뢰를 만듭니다.",
"타인의 기준보다 지금 자신에게 필요한 선택을 먼저 살펴보세요.",
"결정을 내리기 전 한 번 더 확인하는 여유가 좋은 흐름을 만듭니다.",
"완벽한 시작보다 꾸준히 이어갈 수 있는 작은 행동을 선택하세요.",
"마음에 걸리는 일이 있다면 혼자 추측하지 말고 차분히 확인해 보세요."
];
const colors=["샴페인 골드","세이지 그린","미드나잇 블루","라벤더 그레이","웜 아이보리","로즈 브라운","실버","딥 버건디"];
const times=["오전 8시~10시","오전 10시~정오","정오~오후 2시","오후 2시~4시","오후 4시~6시","오후 6시~8시"];
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function pick(arr,key){return arr[hash(key)%arr.length]}
function today(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const o=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${o.year}-${o.month}-${o.day}`}
function dateLabel(d){const [y,m,day]=d.split("-");return `${y}년 ${Number(m)}월 ${Number(day)}일`}
function show(id){
 const s=signs.find(x=>x.id===id),d=today(),key=d+"-"+id;
 document.querySelectorAll(".sign").forEach(b=>{const active=b.dataset.id===id;b.classList.toggle("active",active);b.setAttribute("aria-pressed",active)});
 const score=3+(hash(key+"score")%3),num=1+(hash(key+"number")%99);
 document.getElementById("bannerDate").textContent=dateLabel(d)+" · DAILY READING";
 document.getElementById("headline").textContent=`${s.sym} ${s.name} — 오늘, ${pick(["새로운 균형을 찾는 날","가능성을 넓히는 날","마음을 정돈하는 날","차분히 결실을 준비하는 날"],key+"head")}`;
 document.getElementById("summary").textContent=`${s.traits}이 돋보이는 하루입니다. ${s.focus}에 주의를 기울이면 일상의 흐름을 더 안정적으로 이끌 수 있습니다.`;
 for(const c of ["overall","love","money","work","health"]){
   document.getElementById(c).textContent=pick(banks[c],key+"-"+c);
   // 날짜와 별자리를 기준으로 점수가 고정되며, 날짜가 바뀌면 새 점수로 변경됩니다.
   const rating = 2.5 + ((hash(key+"-"+c+"-rating") % 6) * 0.5);
   const full = Math.floor(rating), half = rating % 1 >= 0.5;
   const stars = "★".repeat(full) + (half ? "½" : "") + "☆".repeat(5-full-(half?1:0));
   document.getElementById(c+"Score").innerHTML = `${stars}<span class="num">${rating.toFixed(1)}</span>`;
 }
 document.getElementById("score").textContent=`오늘의 흐름 ${"★".repeat(score)}${"☆".repeat(5-score)}`;
 document.getElementById("color").textContent="행운의 색 "+pick(colors,key+"color");
 document.getElementById("number").textContent="행운의 숫자 "+num;
 document.getElementById("time").textContent="행운의 시간 "+pick(times,key+"time");
 document.getElementById("advice").textContent=pick(advice,key+"advice");
 document.getElementById("result").style.display="block";
}
function init(){
 const d=today();document.getElementById("date").textContent=dateLabel(d);
 document.getElementById("grid").innerHTML=signs.map(s=>`<button type="button" class="sign" data-id="${s.id}" aria-pressed="false"><span class="symbol">${s.sym}</span><span class="sign-name">${s.name}</span></button>`).join("");
 document.querySelectorAll(".sign").forEach(b=>b.addEventListener("click",()=>show(b.dataset.id)));
 show("aries");
}
init();
</script>
</body>
</html>
